<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>生殖單元｜總結性評量（素養導向選擇題）</title>
  <style>
    :root{
      --bg:#f3f4f6;
      --card:#ffffff;
      --card2:#f8fafc;
      --text:#0f172a;
      --muted:#475569;
      --line:#e2e8f0;

      --ok:#16a34a;
      --bad:#dc2626;
      --accent:#2563eb;
      --warn:#b45309;

      --shadow: 0 10px 26px rgba(15,23,42,.10);
      --radius: 16px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      background:
        radial-gradient(1200px 700px at 10% 10%, rgba(37,99,235,.10), transparent 60%),
        radial-gradient(1000px 600px at 90% 20%, rgba(22,163,74,.08), transparent 55%),
        radial-gradient(900px 600px at 40% 95%, rgba(245,158,11,.10), transparent 60%),
        var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    a{color:inherit}
    .wrap{
      max-width: 1020px;
      margin: 28px auto 60px;
      padding: 0 16px;
    }
    header{
      display:flex;
      gap:16px;
      align-items:flex-start;
      justify-content:space-between;
      margin-bottom: 14px;
    }
    .titleBox{
      background: linear-gradient(180deg, rgba(255,255,255,1), rgba(248,250,252,1));
      border: 1px solid rgba(15,23,42,.08);
      border-radius: var(--radius);
      padding: 18px 18px 14px;
      box-shadow: var(--shadow);
      flex: 1;
    }
    h1{
      margin:0 0 6px;
      font-size: 1.35rem;
      letter-spacing:.5px;
    }
    .subtitle{
      margin:0;
      color: var(--muted);
      font-size:.95rem;
    }
    .badge{
      margin-top:10px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      color: var(--muted);
      font-size:.9rem;
    }
    .pill{
      border:1px solid rgba(15,23,42,.10);
      background: rgba(248,250,252,1);
      padding:6px 10px;
      border-radius: 999px;
    }

    .card{
      background: rgba(255,255,255,.95);
      border: 1px solid rgba(15,23,42,.08);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-top: 14px;
    }
    .row{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    label{
      display:block;
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="number"]{
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(15,23,42,.12);
      background: rgba(248,250,252,1);
      color: var(--text);
      outline: none;
    }
    input[type="text"]:focus, input[type="number"]:focus{
      border-color: rgba(37,99,235,.55);
      box-shadow: 0 0 0 4px rgba(37,99,235,.14);
    }
    .hint{
      margin-top:10px;
      color: var(--muted);
      font-size:.9rem;
    }

    .q{
      background: rgba(248,250,252,1);
      border: 1px solid rgba(15,23,42,.08);
      border-radius: 14px;
      padding: 14px;
      margin-top: 12px;
    }
    .qHead{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .qNum{
      display:flex; align-items:center; gap:10px;
      font-weight: 800;
    }
    .numTag{
      width:34px; height:34px;
      border-radius: 10px;
      display:grid; place-items:center;
      background: rgba(37,99,235,.10);
      border: 1px solid rgba(37,99,235,.18);
      color: rgba(30,64,175,1);
      font-weight: 900;
    }
    .qText{
      flex:1;
      font-size: 1rem;
    }
    .options{
      display:grid;
      gap: 10px;
      margin-top: 10px;
    }
    .opt{
      display:flex;
      gap:10px;
      align-items:flex-start;
      padding: 10px 10px;
      border-radius: 12px;
      border: 1px solid rgba(15,23,42,.10);
      background: rgba(255,255,255,1);
      cursor:pointer;
      transition: transform .06s ease, border-color .12s ease, background .12s ease;
    }
    .opt:hover{
      transform: translateY(-1px);
      border-color: rgba(37,99,235,.28);
      background: rgba(37,99,235,.04);
    }
    .opt input{ margin-top:3px; }
    .opt span{ display:block; }
    .opt .letter{
      width: 26px; height: 26px;
      border-radius: 9px;
      display:grid; place-items:center;
      background: rgba(15,23,42,.04);
      border:1px solid rgba(15,23,42,.08);
      color: var(--text);
      font-weight: 800;
      flex: 0 0 auto;
    }

    .actions{
      display:flex;
      justify-content:center;
      gap: 10px;
      margin-top: 18px;
    }
    button{
      border: 0;
      cursor: pointer;
      border-radius: 14px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: .5px;
      color: #ffffff;
      background: linear-gradient(180deg, rgba(37,99,235,1), rgba(29,78,216,1));
      box-shadow: 0 12px 26px rgba(37,99,235,.22);
    }
    button.secondary{
      background: rgba(248,250,252,1);
      color: var(--text);
      border: 1px solid rgba(15,23,42,.12);
      box-shadow: none;
      font-weight: 800;
    }
    button:active{ transform: translateY(1px); }
    button:disabled{
      opacity: .55;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    .msg{
      margin-top: 12px;
      color: #7c2d12;
      background: rgba(245,158,11,.18);
      border: 1px solid rgba(245,158,11,.28);
      padding: 10px 12px;
      border-radius: 14px;
      display:none;
    }

    .result{
      margin-top: 16px;
      display:none;
    }
    .scoreBox{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      padding: 14px;
      border-radius: 16px;
      background: rgba(22,163,74,.10);
      border: 1px solid rgba(22,163,74,.22);
    }
    .scoreLeft h2{
      margin:0 0 6px;
      font-size: 1.2rem;
    }
    .scoreMeta{
      margin:0;
      color: var(--muted);
      font-size:.95rem;
    }
    .scoreRight{
      text-align:right;
      min-width: 180px;
    }
    .scoreBig{
      font-size: 2.1rem;
      font-weight: 900;
      margin:0;
      letter-spacing: .5px;
    }
    .scoreSmall{
      margin:0;
      color: var(--muted);
      font-size:.95rem;
    }

    .detail{ margin-top: 14px; }
    .detailItem{
      border-radius: 16px;
      padding: 14px;
      margin-top: 12px;
      border: 1px solid rgba(15,23,42,.08);
      background: rgba(248,250,252,1);
    }
    .tagRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      flex-wrap:wrap;
      margin-bottom: 10px;
    }
    .statusTag{
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 900;
      font-size: .9rem;
      border: 1px solid rgba(15,23,42,.10);
    }
    .ok{ background: rgba(22,163,74,.12); border-color: rgba(22,163,74,.25); color:#065f46; }
    .bad{ background: rgba(220,38,38,.12); border-color: rgba(220,38,38,.25); color:#7f1d1d; }

    .ansLine{ margin: 8px 0 0; }
    .ansLine b{ color:#1e40af; }

    .explain{
      margin: 10px 0 0;
      color: #0f172a;
      border-left: 3px solid rgba(37,99,235,.45);
      padding-left: 10px;
      background: rgba(37,99,235,.03);
      border-radius: 10px;
      padding-top: 8px;
      padding-bottom: 8px;
      padding-right: 10px;
    }
    .footerNote{
      margin-top: 14px;
      color: var(--muted);
      font-size: .9rem;
    }

    @media (max-width: 720px){
      header{ flex-direction:column; }
      .row{ grid-template-columns: 1fr; }
      .scoreRight{ text-align:left; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="titleBox">
        <h1>生殖單元｜總結性評量（素養導向選擇題 20 題）</h1>
        <p class="subtitle">請先輸入班級、座號、姓名，再完成作答。提交後會顯示分數與各題詳解。</p>
        <div class="badge">
          <span class="pill">題型：四選一</span>
          <span class="pill">配分：每題 5 分（共 100 分）</span>
          <span class="pill">提交後可檢視詳解</span>
        </div>
      </div>
    </header>

    <section class="card" aria-label="基本資料">
      <div class="row">
        <div>
          <label for="className">班級</label>
          <input id="className" type="text" placeholder="例：701、八年三班" autocomplete="off" />
        </div>
        <div>
          <label for="seatNo">座號</label>
          <input id="seatNo" type="number" inputmode="numeric" min="1" step="1" placeholder="例：12" />
        </div>
        <div>
          <label for="studentName">姓名</label>
          <input id="studentName" type="text" placeholder="請輸入姓名" autocomplete="off" />
        </div>
      </div>
      <div class="hint">作答提醒：請仔細閱讀情境，找出關鍵資訊再判斷。</div>
      <div id="msg" class="msg" role="alert"></div>
    </section>

    <section id="quiz" class="card" aria-label="題目區">
      <!-- questions render here -->
      <div class="actions">
        <button id="submitBtn" type="button">提交答案</button>
        <button id="resetBtn" type="button" class="secondary">清除重作</button>
      </div>
    </section>

    <section id="result" class="card result" aria-label="作答結果">
      <div class="scoreBox">
        <div class="scoreLeft">
          <h2>作答結果</h2>
          <p id="studentMeta" class="scoreMeta"></p>
        </div>
        <div class="scoreRight">
          <p id="scoreBig" class="scoreBig"></p>
          <p id="scoreSmall" class="scoreSmall"></p>
        </div>
      </div>

      <div id="detail" class="detail"></div>

      <div class="actions">
        <button id="backToTopBtn" type="button" class="secondary">回到最上方</button>
      </div>

      <div class="footerNote">※ 本頁不會上傳資料；若需收作答紀錄，可再加上匯出/後端功能。</div>
    </section>
  </div>

  <script>
    const QUESTIONS = [
      {
        stem: "某生物的體細胞染色體為 2n。若它要進行有性生殖，產生配子的關鍵細胞分裂方式最可能是下列何者？",
        options: ["有絲分裂（染色體數不變）", "減數分裂（染色體數減半）", "直接由受精卵分裂產生配子", "細胞質分裂不需核分裂"],
        answer: 1,
        explanation: "有性生殖需要形成配子；配子必須帶有一半染色體數（n），因此由減數分裂產生，才能在受精後恢復為 2n。"
      },
      {
        stem: "兩位同學討論：『受精之後，子代染色體數目能維持與親代相同』。要讓這句話成立，最關鍵的原因是什麼？",
        options: ["受精前先形成配子且配子為 n", "受精後立即進行有絲分裂", "子代一定和親代長得一樣", "受精只發生在水中"],
        answer: 0,
        explanation: "配子經減數分裂形成為 n，受精時 n+n→2n，染色體數目回到與親代相同，並使每對染色體分別來自不同親代。"
      },
      {
        stem: "下列哪一個情境最符合『體外受精』的特徵？",
        options: ["雄性將精子送入雌性體內，在體內完成結合", "卵與精子在水中結合，常同時釋放大量卵與精子", "受精卵在母體子宮內著床發育", "精子經輸卵管與卵相遇"],
        answer: 1,
        explanation: "體外受精常見於多數兩生類、魚類等，卵與精子排到體外（多在水中）結合，為提高成功率常大量釋放。"
      },
      {
        stem: "某魚類在繁殖季節會一次釋放大量卵與精子到水中。此策略最主要是為了彌補下列哪一項限制？",
        options: ["體外受精容易受環境干擾，成功率較低", "體內受精的環境太穩定", "卵在母體內會得到較多養分", "受精後不會形成胚胎"],
        answer: 0,
        explanation: "體外受精受水流、掠食、稀釋等影響較大，因此釋放大量配子可增加碰撞結合的機會。"
      },
      {
        stem: "下列哪一項最能說明『體內受精』通常成功率較高、釋卵數較少的原因？",
        options: ["受精環境較不易被破壞，較穩定", "卵一定會在水中發育", "體內受精一定是卵生", "體內受精不需要交配行為"],
        answer: 0,
        explanation: "體內受精在雌性體內完成，較不受外界干擾；因此不必像體外受精那樣大量釋放配子。"
      },
      {
        stem: "某動物胚胎在母體外的卵中發育、孵化後出生。此動物屬於哪一類？",
        options: ["胎生", "卵生", "無性生殖", "出芽生殖"],
        answer: 1,
        explanation: "卵生的胚胎在母體外發育（通常在卵內），如多數魚類、兩生類、鳥類與多數爬蟲類。"
      },
      {
        stem: "下列哪個配對最合理？",
        options: ["胎生—胚胎在母體外發育", "卵生—胚胎在母體內發育到出生", "胎生—胚胎留在母體內發育到成熟後出生", "卵生—一定採體內受精"],
        answer: 2,
        explanation: "胎生的胚胎留在母體內發育，成熟後由母體產出；卵生則在母體外發育。卵生的受精方式可能是體內或體外。"
      },
      {
        stem: "青蛙進行繁殖時，雄蛙抱住雌蛙促使排卵，並將精子排到水中使卵受精。此過程最適合稱為：",
        options: ["體內受精", "假交配與體外受精", "胎生與體外受精", "無性生殖"],
        answer: 1,
        explanation: "雄蛙並未將精子送入雌蛙體內，因此是體外受精；抱緊雌蛙促排卵但非真正交配，稱為假交配。"
      },
      {
        stem: "某鳥類雄鳥在繁殖季會展示鮮豔外表、發出特殊聲音吸引雌鳥。這類行為主要屬於：",
        options: ["求偶行為", "護卵行為", "育幼行為", "著床行為"],
        answer: 0,
        explanation: "求偶是利用鳴叫、氣味、顏色或展示外表等方式吸引同種異性，以達到繁殖目的。"
      },
      {
        stem: "企鵝把卵放在腳上、用腹部覆蓋來孵卵；母猴哺育幼猴直到能獨立。這些行為的共同效益是：",
        options: ["增加受精卵數量", "提高後代存活率", "使受精改為體外受精", "使染色體數目減半"],
        answer: 1,
        explanation: "護卵與育幼能保護卵與幼體、提供食物或安全，最終提升後代存活率。"
      },
      {
        stem: "哺乳類通常子代數目較少，但存活率較高。下列哪個推論最合理？",
        options: ["因為哺乳類都用體外受精", "因為投入較多親代照護與資源於少數子代", "因為哺乳類不會遭遇天敵", "因為子代不需要呼吸"],
        answer: 1,
        explanation: "哺乳類常伴隨育幼與照護，將時間與能量集中在較少子代身上，提升存活率。"
      },
      {
        stem: "人類受精通常發生在女性生殖系統的哪個部位？",
        options: ["卵巢", "輸卵管", "子宮頸", "陰道"],
        answer: 1,
        explanation: "人類精子通常在輸卵管與卵相遇並完成受精；之後受精卵再移向子宮。"
      },
      {
        stem: "受精卵分裂後移向子宮並埋入增厚的子宮內膜繼續發育，此過程稱為：",
        options: ["授粉", "著床", "排卵", "孵卵"],
        answer: 1,
        explanation: "著床是胚胎（或受精卵分裂形成的早期胚）埋入子宮內膜、開始在子宮內發育的關鍵步驟。"
      },
      {
        stem: "胎兒與母親的血管沒有直接相連，但仍可獲得養分與氧氣並排出廢物，主要仰賴：",
        options: ["花粉管", "胎盤與臍帶", "子宮頸黏液", "羊水"],
        answer: 1,
        explanation: "胎兒透過胎盤與臍帶與母體進行物質交換：獲得養分與氧氣、排出廢物。"
      },
      {
        stem: "羊膜內的羊水包圍胎兒，最主要的功能是：",
        options: ["供給花蜜吸引昆蟲", "減低震動與保護胎兒", "讓受精在水中進行", "使胚珠發育成果實"],
        answer: 1,
        explanation: "羊水能緩衝外力、減低震動，對胎兒具有保護作用。"
      },
      {
        stem: "以開花植物為例，下列哪一組最符合『生殖器官』的描述？",
        options: ["根、莖、葉", "花、果實、種子", "種皮、胚乳、子葉", "花托、萼片、花瓣（僅外觀構造）"],
        answer: 1,
        explanation: "開花植物的生殖相關器官包含花（產生配子與受精）、果實（保護與散播）、種子（發育成新個體）。"
      },
      {
        stem: "花粉落到雌蕊柱頭上的過程稱為：",
        options: ["受精", "授粉", "著床", "排卵"],
        answer: 1,
        explanation: "授粉是花粉由媒介（風、昆蟲、鳥等）傳播並落到柱頭的過程；受精則是精細胞與卵結合。"
      },
      {
        stem: "授粉後花粉萌發出花粉管。花粉管的主要功能是：",
        options: ["把卵送到雄蕊", "讓精細胞進入胚珠與卵結合", "把子房變成果實", "把種子散播到遠方"],
        answer: 1,
        explanation: "花粉管是精細胞前往子房內胚珠的通道，使精細胞能與卵結合完成受精。"
      },
      {
        stem: "開花植物受精後，『子房』與『胚珠』通常分別發育成：",
        options: ["子房→種子；胚珠→果實", "子房→果實；胚珠→種子", "子房→花粉；胚珠→花粉管", "子房→萼片；胚珠→花瓣"],
        answer: 1,
        explanation: "受精後子房膨大發育成果實；胚珠發育成種子。"
      },
      {
        stem: "比較風媒花與蟲媒花：哪一組特徵最符合『風媒花』？",
        options: ["花朵大而鮮豔、有香氣、有蜜腺、花粉黏", "花朵不顯眼、花粉較多較輕、較不黏、常不香", "一定靠鳥傳粉、花粉管很短", "花朵越大越適合風媒，且花粉越黏越好"],
        answer: 1,
        explanation: "風媒花通常不需吸引昆蟲：花朵較不顯眼、花粉量多且輕，利於風吹散；蟲媒花則常鮮豔、有香氣或蜜腺、花粉較黏以利附著昆蟲。"
      }
    ];

    // ★ 你的 Google Apps Script Web App（已部署）網址
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz1kLXr38xAEy5o67IO6H7WxsmODJJ08N-U6b61hDt8IUbf8JjLSzY3rOJyUKNPXjsNUA/exec";

    // 將分數上傳到試算表（使用 text/plain + no-cors，避免多數瀏覽器 CORS/preflight 問題）
    function uploadScoreToSheet(payload){
      return fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
    }

    const quizEl = document.getElementById("quiz");
    const msgEl = document.getElementById("msg");
    const resultEl = document.getElementById("result");
    const detailEl = document.getElementById("detail");
    const submitBtn = document.getElementById("submitBtn");
    const resetBtn = document.getElementById("resetBtn");
    const backToTopBtn = document.getElementById("backToTopBtn");

    function escapeHtml(str){
      return String(str).replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[m]));
    }

    function renderQuiz(){
      const actions = quizEl.querySelector(".actions");
      quizEl.innerHTML = "";
      QUESTIONS.forEach((q, idx) => {
        const qBox = document.createElement("div");
        qBox.className = "q";
        qBox.setAttribute("data-q", idx);

        const head = document.createElement("div");
        head.className = "qHead";

        const left = document.createElement("div");
        left.className = "qNum";
        left.innerHTML = `<div class="numTag" aria-label="題號">${idx+1}</div>`;

        const text = document.createElement("div");
        text.className = "qText";
        text.textContent = q.stem;

        head.appendChild(left);
        head.appendChild(text);

        const opts = document.createElement("div");
        opts.className = "options";

        const letters = ["A","B","C","D"];
        q.options.forEach((opt, oIdx) => {
          const id = `q${idx}_o${oIdx}`;
          const label = document.createElement("label");
          label.className = "opt";
          label.setAttribute("for", id);

          label.innerHTML = `
            <span class="letter">${letters[oIdx]}</span>
            <input id="${id}" type="radio" name="q${idx}" value="${oIdx}" />
            <span>${escapeHtml(opt)}</span>
          `;
          opts.appendChild(label);
        });

        qBox.appendChild(head);
        qBox.appendChild(opts);
        quizEl.appendChild(qBox);
      });

      quizEl.appendChild(actions);
    }

    function showMsg(text){
      msgEl.textContent = text;
      msgEl.style.display = "block";
      msgEl.scrollIntoView({behavior:"smooth", block:"center"});
    }
    function clearMsg(){
      msgEl.textContent = "";
      msgEl.style.display = "none";
    }

    function getStudentInfo(){
      const className = document.getElementById("className").value.trim();
      const seatNo = document.getElementById("seatNo").value.trim();
      const studentName = document.getElementById("studentName").value.trim();
      return { className, seatNo, studentName };
    }

    function validateAllAnswered(){
      const unanswered = [];
      QUESTIONS.forEach((_, idx) => {
        const picked = document.querySelector(`input[name="q${idx}"]:checked`);
        if(!picked) unanswered.push(idx+1);
      });
      return unanswered;
    }

    function grade(){
      const picks = [];
      let correctCount = 0;

      QUESTIONS.forEach((q, idx) => {
        const pickedEl = document.querySelector(`input[name="q${idx}"]:checked`);
        const picked = pickedEl ? Number(pickedEl.value) : null;
        picks.push(picked);
        if(picked === q.answer) correctCount++;
      });

      return { picks, correctCount };
    }

    function renderResult({picks, correctCount}){
      const { className, seatNo, studentName } = getStudentInfo();
      const total = QUESTIONS.length;
      const score = correctCount * 5;

      document.getElementById("studentMeta").textContent =
        `班級：${className}　座號：${seatNo}　姓名：${studentName}`;
      document.getElementById("scoreBig").textContent = `${score} 分`;
      document.getElementById("scoreSmall").textContent =
        `答對 ${correctCount} / ${total} 題（每題 5 分）`;

      detailEl.innerHTML = "";
      const letters = ["A","B","C","D"];

      QUESTIONS.forEach((q, idx) => {
        const picked = picks[idx];
        const isOK = picked === q.answer;

        const studentAns = (picked === null) ? "（未作答）" : `${letters[picked]}：${q.options[picked]}`;
        const correctAns = `${letters[q.answer]}：${q.options[q.answer]}`;

        const item = document.createElement("div");
        item.className = "detailItem";
        item.innerHTML = `
          <div class="tagRow">
            <div class="numTag" aria-label="題號">${idx+1}</div>
            <div class="statusTag ${isOK ? "ok" : "bad"}">${isOK ? "答對" : "答錯"}</div>
          </div>
          <div style="margin:6px 0 0;">${escapeHtml(q.stem)}</div>
          <p class="ansLine"><b>你的答案：</b>${escapeHtml(studentAns)}</p>
          <p class="ansLine"><b>正確答案：</b>${escapeHtml(correctAns)}</p>
          <div class="explain"><b>詳解：</b>${escapeHtml(q.explanation)}</div>
        `;
        detailEl.appendChild(item);
      });

      resultEl.style.display = "block";
      resultEl.scrollIntoView({behavior:"smooth", block:"start"});
    }

    function resetAll(){
      clearMsg();
      document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
      resultEl.style.display = "none";
      detailEl.innerHTML = "";
      submitBtn.disabled = false;
      submitBtn.textContent = "提交答案";
      window.scrollTo({top:0, behavior:"smooth"});
    }

    submitBtn.addEventListener("click", () => {
      clearMsg();

      const { className, seatNo, studentName } = getStudentInfo();
      if(!className || !seatNo || !studentName){
        showMsg("請先完整填寫：班級、座號、姓名。");
        return;
      }

      const unanswered = validateAllAnswered();
      if(unanswered.length){
        const preview = unanswered.slice(0, 8).join("、");
        const more = unanswered.length > 8 ? `…（共 ${unanswered.length} 題未作答）` : "";
        showMsg(`尚有題目未作答：第 ${preview} 題${more}`);
        const first = unanswered[0]-1;
        const target = document.querySelector(`[data-q="${first}"]`);
        if(target) target.scrollIntoView({behavior:"smooth", block:"center"});
        return;
      }

      const { picks, correctCount } = grade();
      const total = QUESTIONS.length;
      const score = correctCount * 5;

      const letters = ["A","B","C","D"];
      const answers = picks.map(p => letters[p]).join(",");

      // 上傳到雲端試算表（總結評量工作表）
      uploadScoreToSheet({
        className,
        seatNo,
        studentName,
        score,
        correctCount,
        total,
        answers,
        quizTitle: document.title,
        userAgent: navigator.userAgent,
        submittedAt: new Date().toISOString()
      }).catch(()=>{ /* 送出失敗也不影響顯示分數 */ });

      renderResult({ picks, correctCount });

      // 避免重複送出：提交後先鎖定（按「清除重作」會解鎖）
      submitBtn.disabled = true;
      submitBtn.textContent = "已提交";
    });

    resetBtn.addEventListener("click", resetAll);
    backToTopBtn.addEventListener("click", () => window.scrollTo({top:0, behavior:"smooth"}));

    renderQuiz();
  </script>
</body>
</html>
